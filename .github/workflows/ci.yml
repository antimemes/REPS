# CI runs exactly what `task ci` runs locally, through the same flake-pinned dev
# shell — one toolchain (uv, python, pyright, mdbook all from flake.lock),
# no action-installed versions to keep in sync, and a green `task ci` on a dev
# machine predicts a green run here. Keyless throughout — mockllm/mock only, no
# provider credentials, no docker experiments.
#
# Per-check visibility lives in the log: task prefixes every command with its
# target (`task: [typecheck] …`) and a failure names the failing target. The
# only things that still float are the runner OS and nix itself.
#
# Docs are deliberately NOT part of this surface — they build and deploy on
# their own fast, paths-filtered lane (docs.yml) so doc iteration never waits
# on the full check suite.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # nix-shell -p (the nix-run leg of the entrypoint check) resolves <nixpkgs>
      # from here; the installer action doesn't set one
      NIX_PATH: nixpkgs=channel:nixos-26.05
    steps:
      - uses: actions/checkout@v4
      # the NixOS-org installer action; still self-labeled experimental with no
      # stable tags (hence @main) — chosen deliberately over the third-party ones
      - uses: NixOS/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            keep-outputs = true
            keep-env-derivations = true
      # keyspace `nix-1`: bumped 2026-07-29 — the previous workflow saved a store
      # pruned mid-closure (referrer drvs kept, input drvs gone), and a restored
      # partial store fails ALL evals with "store path …drv does not exist"; keys
      # are immutable, so only a new keyspace escapes it. The gcroots step below
      # keeps future saves closure-coherent.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-1-${{ runner.os }}-${{ hashFiles('flake.lock', '**/uv.lock') }}
          restore-prefixes-first-match: nix-1-${{ runner.os }}-
          gc-max-store-size-linux: 5G
      # the nix store cache covers the built environments; these cover what the
      # devshell's own uv downloads at `uv run` time
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - name: task ci — the full check surface, same command as local
        run: nix-shell --run 'task ci'

      # GC roots for the cache action's pre-save GC: with keep-outputs /
      # keep-env-derivations these pin the devshell toolchain and the built
      # experiment surface as coherent closures, so the size cap prunes whole
      # unused closures instead of slicing
      # random paths out of live ones. Instantiate-only — builds nothing, so it
      # is cheap even when task ci failed early (hence always()).
      - name: pin cacheable closures
        if: always()
        run: |
          roots="$RUNNER_TEMP/gcroots"; mkdir -p "$roots"
          nix-instantiate shell.nix --add-root "$roots/shell" >/dev/null
          nix-instantiate -A manifests -A exec.inspect-hello --add-root "$roots/reps" >/dev/null
