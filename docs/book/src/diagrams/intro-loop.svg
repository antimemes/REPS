<svg viewBox="0 0 480 78" width="480" role="img" aria-label="The loop: configure, run locally, look at the result." style="max-width:100%;height:auto;display:block;margin:1.4em auto;font-family:inherit">
  <defs>
    <marker id="reps-arr-loop" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--fg, #333)" fill-opacity="0.55"/>
    </marker>
  </defs>
  <g>
    <rect x="12" y="12" width="136" height="54" rx="7" fill="var(--quote-bg, rgba(128,128,128,.08))" stroke="var(--table-border-color, #999)"/>
    <text x="80" y="33" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg, #333)">configure</text>
    <text x="80" y="52" text-anchor="middle" font-size="11" fill="var(--fg, #333)" fill-opacity="0.65">CLI parameters</text>
    <rect x="172" y="12" width="136" height="54" rx="7" fill="var(--quote-bg, rgba(128,128,128,.08))" stroke="var(--table-border-color, #999)"/>
    <text x="240" y="33" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg, #333)">run locally</text>
    <text x="240" y="52" text-anchor="middle" font-size="11" fill="var(--fg, #333)" fill-opacity="0.65">a nix one-liner</text>
    <rect x="332" y="12" width="136" height="54" rx="7" fill="var(--quote-bg, rgba(128,128,128,.08))" stroke="var(--table-border-color, #999)"/>
    <text x="400" y="33" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg, #333)">look</text>
    <text x="400" y="52" text-anchor="middle" font-size="11" fill="var(--fg, #333)" fill-opacity="0.65">saved run files</text>
  </g>
  <g stroke="var(--fg, #333)" stroke-opacity="0.55" fill="none">
    <path d="M 148 39 L 168 39" marker-end="url(#reps-arr-loop)"/>
    <path d="M 308 39 L 328 39" marker-end="url(#reps-arr-loop)"/>
  </g>
</svg>
