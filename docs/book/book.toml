[book]
title = "REPS User Guide"
authors = ["Antimemetics Institute"]
description = "REPS: replications of multi-agent safety experiments."
language = "en"
src = "src"

[build]
create-missing = false

# expands {{repo}} to the owner/name slug derived from git-repository-url below —
# the ONE place the repository is named (vars.py; reps-commands.js necessarily
# repeats it as its GITHUB/TARBALL constants)
[preprocessor.vars]
command = "python3 vars.py"

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/antimemetics-institute/reps"
edit-url-template = "https://github.com/antimemetics-institute/reps/edit/main/docs/book/{path}"
no-section-label = false
additional-css = ["theme/reps-commands.css", "theme/reps-tabs.css"]
additional-js = ["theme/reps-commands.js"]

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
