[project]
name = "reps-testing"
version = "0.1.0"
description = "Shared pytest fixtures for REPS experiment authors"
requires-python = ">=3.13"
dependencies = ["pytest>=8", "reps-events"]

[project.entry-points.pytest11]
reps_testing = "reps_testing.plugin"

[tool.uv.sources]
reps-events = { path = "../reps-events", editable = true }

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "reps_testing/**/*.py" }, { file = "reps_testing/py.typed" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reps_testing"]

[dependency-groups]
dev = ["pytest-xdist"]

[tool.pytest.ini_options]
addopts = "-n auto"
