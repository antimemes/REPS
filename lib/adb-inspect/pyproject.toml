# The shared inspect wrapper: one program (`adb-inspect-eval CONFIG.json`) that runs
# an inspect_ai eval and translates its EvalLog into ADB events. Experiment families
# (experiments/hello, experiments/impossiblebench, …) depend on this library and add
# the package that provides their tasks; the family's adapter bakes the task spec
# (`pkg:<module>:<attr>`) into the config. Shared infra: NOT part of any experiment's
# content identity — wrapper versions are recorded per run as covariates instead.
[project]
name = "adb-inspect"
version = "0.1.0"
description = "Run an Inspect (inspect_ai) eval as an ADB experiment program — task spec + params in, ADB events out"
requires-python = ">=3.13"
dependencies = [
    # Since 0.3.184, input_tokens excludes cache reads/writes. Keep that semantic
    # floor; exact versions are locked and recorded per run as provenance.
    "inspect-ai>=0.3.184,<0.4",
    # Every API-backed inspect provider SDK, installed uniformly: one env serves all
    # providers (and mixed-provider multiagent runs), so the environment never varies
    # with the model param. Lower bounds mirror inspect's own runtime version checks
    # (model/_providers/providers.py at the locked inspect-ai). Local-inference
    # providers (hf, vllm, sglang, llama-cpp-python, transformer_lens) are deliberately
    # excluded — they pull torch-scale stacks and change machine requirements; a family
    # that wants one must declare it explicitly in its own pyproject.
    # `openai` also powers every OpenAI-compatible provider (openai-api, openrouter,
    # together, fireworks, ollama, moonshot, perplexity, cloudflare, …) via base_url.
    # The locked Inspect HTTP providers import httpx2 and newer Responses types.
    "openai>=3.24.0",
    "anthropic>=0.115.0",
    "google-genai>=1.69.0",
    "groq>=0.28.0",
    "mistralai>=2.0.1",
    "xai-sdk>=1.7.0",
    # azure-ai-inference has no stable release; the pre-release specifier opts uv in
    "azure-ai-inference>=1.0.0b4",
    # bedrock + sagemaker
    "aioboto3>=13.0.0",
    # the shared ADB event shapes — typed, validated emission (no hand-built dicts)
    "adb-events",
    "pydantic>=2",
]

# adb-events is in-repo (not yet on PyPI); the nix build (adb.mkPythonEnv) also
# overrides it to the same source.
[tool.uv.sources]
adb-testing = { path = "../adb-testing", editable = true }
adb-events = { path = "../adb-events", editable = true }

# Non-editable path-dep consumers (the inspect experiment families) rebuild only
# when the cache key changes, and uv's default key is pyproject.toml alone — key
# on the sources so edits propagate.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "adb_inspect/**/*.py" }, { file = "adb_inspect/py.typed" }]
[project.scripts]
adb-inspect-eval = "adb_inspect.main:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist", "adb-testing"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adb_inspect"]

[tool.pytest.ini_options]
addopts = "-n auto"
