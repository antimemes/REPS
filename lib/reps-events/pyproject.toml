[project]
name = "reps-events"
version = "0.1.0"
description = "The standardized REPS event shapes — shared by the runner and Python control planes"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12,<3",
]

[project.scripts]
reps-emit = "reps_events.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist", "reps-testing", "duckdb>=1.4,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reps_events"]

# Consumers take this package as a non-editable path dep, and uv's default cache
# key is pyproject.toml alone — a source-only edit here would leave every
# consumer's venv running (and typechecking) a stale copy until the next relock.
# Keying the built wheel on the sources makes `uv sync`/`uv run` pick edits up.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "reps_events/**/*.py" }, { file = "reps_events/schema.json" }, { file = "reps_events/py.typed" }]

[tool.uv.sources]
reps-testing = { path = "../reps-testing", editable = true }

[tool.pytest.ini_options]
addopts = "-n auto"
