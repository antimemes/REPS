#:schema https://raw.githubusercontent.com/antimemes/memelint/main/crates/memelint/memelint.schema.json

# The glossary of REPS: the technical names of this project, each with its meaning.
# A word goes here when it names one definite item in this repository and the
# bundled lists of memelint do not have it; a vague word is prose work, not list
# work. An experiment's names live in its memes.txt and apply to its directory.
subtree-word-lists = ["experiments/*/memes.txt"]
ignore = [".cache/", "lib/reps-events/reps_events/inspect_chat.py"]   # vendored Inspect AI text, not ours to rewrite

words = [
  # REPS terms
  "actor",             # the agent or component an event is attributed to; the `actor` render-hint field and roster IDs
  "adb",               # the former project name, kept in the adb-site repository name
  "app",               # a Nix flake app: a runnable output started with `nix run .#name`
  "argv",              # the command-line argument list of a process (secrets do not go there)
  "author",            # the person who wrote an experiment, or the upstream paper's code (the authors' tree)
  "backslash",         # the `\` character, as in backslash-newline continuation
  "batch",             # a set of runs launched together; the runner's batch command
  "boundary",          # the model-API edge: the data that crossed the API goes in llm.call (boundary data, boundary producers)
  "browser",           # a web browser; the runner's preview serves the data directory to one
  "bucket",            # an S3-style storage bucket holding one experiment's `runs/`
  "call",              # one request to a model or tool; the llm.call event
  "card",              # run.json, the runner's index card for one run (lifecycle state plus cached stream facts)
  "catalog",           # a curated list: the experiment manifest directory, or the model catalog in lib/model-catalog
  "cell",              # one cell of an upstream sweep: one task on one instance and one model
  "checkout",          # a local git working copy of the repository, not a Nix store path or a tarball
  "citation",          # a model-output reference to a source; Inspect's vendored Citation models
  "combobox",          # the type-to-filter model picker in the GUI
  "covariate",         # a value recorded for each run (wrapper version, CPU) that is not part of the condition identity
  "databank",          # the published run store and its site (databank.antimemetics.institute)
  "deployment",        # an Azure OpenAI deployment: the named model endpoint on a resource
  "discriminated",     # as in "discriminated union": a union with its member chosen by a tag field (the base is not in use)
  "discriminator",     # the tag field that selects a member of a discriminated union (Pydantic's name)
  "emit",              # write an event record to the run stream (emit(), reps-emit)
  "envelope",          # the record wrapper around an event payload (type, run id, sequence, time); the Envelope model
  "experiment",        # a packaged replication in experiments/; the unit a manifest describes and a run executes
  "family",            # a group of experiment variants made from one code package (impossiblebench, inspect_evals)
  "fetch",             # retrieve a pinned source or object through the network (Nix/git sense; fetch_ref)
  "fingerprint",       # the hash of an experiment's declared source paths; part of the condition id
  "headless",          # running with no terminal (non-interactive stdin); the runner does not prompt
  "heartbeat",         # the runner's periodic rewrite of run.json that shows a run is live
  "hello",             # the keyless smoke task and app (inspect-hello, hello_task)
  "identity",          # the facts that make runs poolable: experiment, source fingerprint and params (condition identity)
  "instrumentation",   # the hooks that record events inside the REPS chat client
  "interactive",       # a run with a terminal where the runner can prompt (opposite of headless)
  "keyless",           # a configuration for which no API key is necessary (mock model, offline)
  "knob",              # a parameter a user can change on an experiment; a change to one changes the condition id
  "ladder",            # the ordered credential-profile resolution steps (remembered selection, lone default, picker)
  "loopback",          # the local-only network interface (127.0.0.1) the preview serves on
  "manifest",          # the description Nix makes of an experiment's parameters, results and metadata (manifest.json)
  "metric",            # one declared, measured result of a run (the paper's headline metric); the base of the bundled plural
  "mtime",             # a file's modification time (the card's heartbeat mtime)
  "ndjson",            # newline-delimited JSON, the preview server's event stream format
  "oneliner",          # the copy-paste command that runs one experiment condition
  "page",              # one document of the book, or one run's view in the preview
  "paper",             # the upstream publication an experiment replicates
  "phase",             # a stage within an experiment round (GovSim harvest/restaurant, AgentsNet messages/final)
  "picker",            # the runner's interactive credential-profile menu
  "pin",               # fix a dependency or source to one version
  "pkgs",              # the Nix package set argument and the pkgs/ directory
  "platform",          # the OS/hardware description recorded in run provenance (`platform` field)
  "poll",              # repeatedly request a resource to check for change (preview shell, Vast API)
  "preview",           # `reps-runner preview`, the local read-only run viewer
  "projection",        # a derived read-time view of the event stream (card, index); not a rewrite
  "provenance",        # a run's recorded origin: source, fetch_ref, tree_hash, runtime
  "provisioning",      # the run lifecycle state before running; Inspect pulls or builds its sandbox images here
  "publish",           # upload a verified run to the run store (`reps-runner publish`)
  "receiver",          # the reference event-socket receiver (reps_testing) used by tests
  "registry",          # the experiment package registry in pkgs/ that discovers experiments and their tests
  "relock",            # regenerate a uv.lock after a pyproject edit (`task relock`)
  "reproducibility",   # a run can be repeated from its recorded source and pins (distinct from identity)
  "reps",              # REPS, this project: replications of multi-agent experiments
  "resolution",        # credential resolution: choosing the env values to inject for a run
  "responder",         # an experiment's keyless mock model that answers its prompts
  "root",              # the top of a tree: repository root, data-dir root, root index.json
  "roster",            # an experiment's declared list of actors with display labels
  "round",             # one iteration of an experiment's loop (GovSim harvest round, AgentsNet message round)
  "run",               # one execution of an experiment in a condition; the unit the run store records
  "runner",            # base of "runners": the REPS program that launches an experiment, envelopes its events and writes the run store
  "scaffold",          # reps_experiment.scaffold, the experiment-side protocol toolkit (emit, deposit_artifact)
  "schema",            # the JSON Schema of a record kind (event schemas, the memelint.toml schema)
  "scenario",          # an experiment's fixed world setup (GovSim fishery/pasture, a Concordia cafe); baked into the card, not a param
  "score",             # the number an experiment's scorer assigns to a run (0 to 1 in AgentsNet)
  "scorer",            # the upstream or Inspect component that computes a sample's score
  "shorthand",         # the runner's CLI value shorthand: JSON, @file, or a bare string
  "simulation",        # one Concordia generative-agent simulation, the thing the concordia experiment runs
  "slug",              # the repository name as owner/name (mdbook {{repo}})
  "solver",            # an Inspect solver, the task's agent loop
  "status",            # the REPS status event: experiment progress text that does not change the lifecycle state
  "stdio",             # a child process's stdin, stdout and stderr pipes, captured by the runner
  "subcommand",        # a named command in the reps or reps-emit CLI
  "tab",               # a tab in the book theme and the run viewer: one labelled panel of a group
  "tester",            # the Nix check that runs an experiment's test suite (pytest tester, smoke tester)
  "toolbar",           # the mdbook top bar that holds the REPS command-settings gear
  "transcript",        # the ordered record of a run's events, or Inspect's event log for each sample
  "translate",         # convert an upstream log or engine output into REPS events (the translate.py modules)
  "translator",        # the module that translates an upstream log into REPS events
  "treatment",         # the experimental manipulation compared against baseline (GovSim treatments, a treatment axis)
  "vendor",            # verb: copy a library's source into this repo (the vendored Inspect chat models); covers "vendored"
  "venue",             # the place a self-hosted engine runs (laptop, cluster, Vast); lives in the profile, not the model ID
  "vertex",            # a graph node (AgentsNet vertex cover); also Google Vertex AI as a provider prefix
  "viewer",            # the local REPS run viewer served by the preview command
  "vocabulary",        # the set of envelope and common event models that all experiments use, versioned by the v field

  # models and the model API
  "assistant",         # the model's role in a chat message list (`assistant` message, prefill)
  "chat",              # the message-list model API (chat completions) and its messages
  "embedder",          # the sentence-embedding model GovSim/Concordia agents use for memory retrieval (govsim.config data.embedder)
  "generation",        # a model producing output; "generation params" are its sampling settings
  "llm",               # a large language model; the llm.call event and the types.llm parameter type
  "model",             # a language model; its name is the provider/model ID
  "prefill",           # a trailing assistant message the model continues
  "prompt",            # text sent to a model; also the runner's terminal question for a credential
  "quantization",      # reduced weight precision; a serving-engine setting
  "role",              # a chat message's speaker kind (system/user/assistant/tool); Inspect's model role
  "temperature",       # the sampling temperature passed to a model

  # tools, libraries, providers and model families
  "agentharm",         # AgentHarm, an Inspect evals benchmark (its scorer joins names with '/')
  "anthropic",         # the model provider behind Claude; the `anthropic/` provider prefix
  "azure",             # Microsoft's cloud; Azure OpenAI endpoints and deployments
  "azureai",           # the REPS provider prefix for an Azure AI deployment (`azureai/<deployment>`)
  "bash",              # the Unix shell that runs the check scripts
  "bedrock",           # AWS Bedrock, a model provider
  "chmod",             # the Unix permission command, referred to in the leaky-store-file fix
  "claude",            # Anthropic's model family (claude-haiku-4-5, claude-opus-4-6)
  "cloudflare",        # Cloudflare Workers AI, an OpenAI-compatible model provider
  "compose",           # Docker Compose, the multi-container tool Inspect sandboxes use
  "concordia",         # Google DeepMind's library for generative agent-based models, wrapped by the Concordia experiment
  "direnv",            # a tool that loads a directory's environment on entry
  "docker",            # the container engine; Inspect's docker sandbox
  "dockerd",           # the Docker daemon
  "fireworks",         # Fireworks AI, a hosted model provider
  "gcloud",            # Google Cloud's command-line tool
  "gemini",            # Google's Gemini model family (model id prefix)
  "git",               # the version control tool
  "github",            # GitHub, the code host
  "google",            # Google as a model provider (google/ model id prefix)
  "grok",              # xAI's Grok model family (grok/ provider prefix)
  "groq",              # Groq, a hosted inference provider
  "httpx",             # the Python HTTP client library
  "impossiblebench",   # ImpossibleBench, a benchmark with tasks that have impossible test variants (experiment family)
  "inspect",           # Inspect, the inspect_ai evaluation framework; also the inspect-* apps
  "kernel",            # the Linux kernel
  "linux",             # the Linux operating system
  "litellm",           # LiteLLM, the model catalog/pricing source used by model-catalog
  "llama",             # Meta's Llama model family (model id stem)
  "manylinux",         # the portable Linux wheel platform tag (PyPI)
  "mdbook",            # mdBook, the docs site generator
  "mistral",           # Mistral AI, a model provider and its models
  "mockllm",           # Inspect's mock model provider (`mockllm/model`), the keyless path
  "moonshotai",        # Moonshot AI, the provider prefix for Kimi models
  "nix",               # the Nix package manager and language; the bundled nix list covers .nix files only
  "nix store",         # Nix's /nix/store, where built outputs live; also "store path"
  "operating system", # the OS under the runner and the experiments (Linux); listed as a phrase
  "npm",               # the Node.js package manager
  "numpy",             # the NumPy array library
  "ollama",            # a local model server
  "openai",            # OpenAI, a model provider; also the OpenAI-compatible API shape
  "openrouter",        # OpenRouter, a model-routing provider
  "overlayfs",         # the Linux overlay filesystem, Docker's storage driver here
  "perplexity",        # Perplexity, a model provider
  "pydantic",          # the Pydantic validation library
  "python",            # the Python language and interpreter
  "sagemaker",         # AWS SageMaker, a hosted model service Inspect can call
  "scp",               # the OpenSSH secure copy program (scp-style host:path references)
  "sglang",            # SGLang, an open-weight model serving engine
  "sudo",              # the Unix program that runs a command as root
  "torch",             # PyTorch, the tensor library GovSim's upstream code imports
  "umask",             # the Unix file-mode creation mask
  "unix",              # the Unix family of operating systems; Unix stream sockets
  "upperdir",          # the overlayfs upper directory that stores writes above the lower layers
  "urllib",            # Python's standard HTTP client package
  "vast",              # Vast.ai, the GPU rental service with Serverless endpoints that host open-weight models
  "virtiofs",          # the virtio filesystem share between a VM and its host
  "vllm",              # vLLM, an open-weight model inference server; the vllm/ model ID prefix
  "werewolf",          # the Werewolf game, the example experiment used in tests and docs
  "zlib",              # the zlib compression library
]

# Words tied to a language: a name that one language's code uses in one sense.
[languages.python]
words = [
  "required",     # pydantic's and TypedDict's term: a field a record must contain
  "program",      # the experiment executable the manifest's `program` names; what the runner starts
  "typed",        # typed experiments, params and observations: declared with a pydantic model, not open dicts
  "evidence",     # the recorded facts the verify gate checks and publish carries (events, card, artifacts)
  "reasoning",    # the model-output part that holds its thought before the answer; `reasoning` settings on a request
  "served",       # the served model name: the name an inference engine answers to, distinct from the catalog id
  "remembered",   # the runner's remembered selection: a credential profile kept in preferences.toml
  "built-in",     # a name the program defines itself, not one the user adds (built-in provider names)
  "fix",          # the remedy the runner prints when it rejects a run (the `fix` field beside `problem`)
  "raise",        # Python's keyword that signals an exception
  "base URL",     # the HTTP origin a provider client prepends to its paths
  "run store",    # the published layout of runs: the local runs/ directory and the S3 bucket
]

[languages.nix]
words = [
  "uv",           # the Python package manager; the bundled python list covers .py files only
  "program",      # the experiment executable `mkExperiment` wraps (its `program` argument)
  "typed",        # typed experiments and params, as in the Python sense
]

[languages.toml]
words = [
  "uv",           # the Python package manager; pyproject comments name it
  "program",      # the experiment executable, as in the Python sense
  "typed",        # typed experiments and params, as in the Python sense
  "served",       # the served model name, as in the Python sense
  "base URL",     # the HTTP origin a provider client prepends to its paths
  "run store",    # the published layout of runs: the local runs/ directory and the S3 bucket
]

# The ratchet: the paths in `clean` pass; the rest of the tree reports the same
# findings as warnings until each directory is cleaned and added here.
[rules]
"3.5" = "warning"
"1.2" = "warning"

[scopes.clean]
paths = ["lib/reps-events/", "lib/reps-experiment/", "memelint.toml"]

[scopes.clean.rules]
"3.5" = "error"
"1.2" = "error"
