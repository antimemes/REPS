# Dev targets — run inside the devshell (`nix develop`), which provides task,
# python, jq, mdbook. Data lands in the tools' default $REPS_DATA_DIR
# (~/.local/share/reps); override with REPS_DATA_DIR=... — but never point it inside this
# repo (a dirty-tree flake hashes its whole directory, so an in-repo data dir mints a
# new condition every run).
version: "3"

tasks:
  default:
    silent: true
    cmds:
      - task --list

  hello:
    desc: fire one keyless run of the bundled inspect-hello task (mock model, offline)
    cmds:
      - nix run .#inspect-hello -- --set model=mockllm/model --set limit=0 --set epochs=1 --set 'generate_args={}'

  preview:
    desc: open the local run viewer with the experiment catalog (params, results, a command constructor); the catalog build is cached after the first run. Flags pass through, e.g. `task preview -- --no-open --port 8765`
    cmds:
      - nix run .#reps-runner -- preview --manifests "$(nix-build --no-out-link -A manifests)" {{.CLI_ARGS}}

  describe:
    desc: print the impossiblebench-livecodebench schema JSON
    cmds:
      - nix run .#impossiblebench-livecodebench -- --describe | jq .

  test:
    desc: run Python tests and the Nix experiment checks
    cmds:
      - task: test:python

  test:python:
    desc: run Python unit tests, checking the runner against the Nix-built experiment manifests
    vars:
      MANIFESTS:
        sh: nix build .#manifests --no-link --print-out-paths
    env:
      REPS_TEST_MANIFESTS: '{{.MANIFESTS}}'
    cmds:
      - cd runner && uv run -q pytest -q
      - cd lib/reps-testing && uv run -q pytest -q
      - cd lib/reps-events && uv run -q pytest -q
      - cd lib/reps-providers && uv run -q pytest -q
      - cd lib/reps-experiment && uv run -q pytest -q
      - cd lib/reps-inspect && uv run -q pytest -q
      - nix flake check -L

  typecheck:
    desc: pyright STRICT (per-package pyrightconfig.json) over the shared libs + runner package sources (not tests — rejection tests pass garbage deliberately); through `uv run` so stale path-dep venv copies resync first. The policy script gates the escapes pyright can't police (ignore-rule + cast allowlists).
    cmds:
      - bash scripts/check-typing-policy.sh
      - cd lib/reps-testing && uv run -q pyright
      - cd lib/reps-events && uv run -q pyright
      - cd lib/reps-providers && uv run -q pyright
      - cd lib/reps-experiment && uv run -q pyright
      - cd lib/reps-inspect && uv run -q pyright
      - cd runner && uv run -q pyright

  docs:
    desc: serve the mdbook user guide on 0.0.0.0:3000 (binds IPv4 so a code-server/reverse proxy on 127.0.0.1 can reach it; mdbook's default localhost binds IPv6 ::1 only)
    dir: docs/book
    cmds:
      - mdbook serve -n 0.0.0.0 -p 3000

  docs:build:
    desc: build the mdbook user guide into docs/book/book
    dir: docs/book
    cmds:
      - mdbook build

  docker:up:
    desc: sudo-start the docker daemon on the default socket (inspect's docker sandbox needs one; a dev shell can't provide a system service, so the devshell ships the engine and this starts it)
    cmds:
      - |
        if docker info >/dev/null 2>&1; then
          echo "docker: already running"
          exit 0
        fi
        # rootful, data on the persistent host share: virtiofs accepts root's chowns
        # but refuses an unprivileged user's subuid ones (which rootless layer
        # extraction needs). fuse-overlayfs because kernel overlayfs refuses a
        # virtiofs upperdir. --group so the socket is usable without sudo.
        sudo mkdir -p /var/lib/dev/docker
        (sudo env "PATH=$PATH" setsid dockerd --data-root /var/lib/dev/docker --storage-driver fuse-overlayfs --group "$(id -gn)" --pidfile /run/dockerd-reps.pid >/tmp/dockerd-reps.log 2>&1 &)
        for _ in $(seq 50); do
          docker info >/dev/null 2>&1 && break
          sleep 0.2
        done
        docker info >/dev/null 2>&1 && echo "docker: up" || {
          echo "docker: failed to start; log tail (/tmp/dockerd-reps.log):" >&2
          sudo tail -20 /tmp/dockerd-reps.log >&2
          exit 1
        }

  docker:down:
    desc: stop the docker daemon started by docker:up (images and containers survive in /var/lib/dev/docker)
    cmds:
      - |
        sudo kill "$(sudo cat /run/dockerd-reps.pid 2>/dev/null)" 2>/dev/null && echo "docker: stopped" || echo "docker: was not running"

  lock:check:
    desc: verify every uv.lock is current with its pyproject (catches an edited dependency list shipped without a relock — nix builds strictly from the lock, so drift only surfaces at runtime)
    cmds:
      - |
        for dir in $(git ls-files '*uv.lock' ':!:pkgs/build-support/tests/fixtures/**' | xargs -n1 dirname); do
          echo "uv lock --check: $dir"
          (cd "$dir" && uv lock --check) || exit 1
        done

  lock:update:
    desc: relock every uv project — run after any pyproject edit; a lib change cascades (consumer locks embed path-dep metadata, e.g. reps-inspect deps → the inspect experiments' locks)
    cmds:
      - |
        for dir in $(git ls-files '*uv.lock' ':!:pkgs/build-support/tests/fixtures/**' | xargs -n1 dirname); do
          echo "uv lock: $dir"
          (cd "$dir" && uv lock) || exit 1
        done

  models:update:
    desc: regenerate lib/model-catalog/model_catalog.json (the types.llm model hints — provider knowledge, wrapper-agnostic) from first-party id sources + public catalogs
    dir: lib/model-catalog
    cmds:
      - python3 update.py

  tasks:update:
    desc: regenerate experiments/inspect_evals/task_catalog.json (one experiment per runnable task, typed params from each task's signature) from the pinned inspect_evals registry + its declared per-eval metadata
    dir: experiments/inspect_evals
    cmds:
      - uv run -q python scripts/update_task_catalog.py

  genconfig:update:
    desc: regenerate lib/reps-inspect/generate_fields.json (the generate_args typed sub-form) from the pinned inspect_ai's GenerateConfig
    dir: lib/reps-inspect
    cmds:
      - uv run -q python scripts/update_generate_fields.py

  ci:
    desc: the full check surface, cheap checks first — CI runs exactly this (ci.yml is setup + `nix-shell --run 'task ci'`), so a green run here predicts a green CI, modulo the runner's OS
    cmds:
      - task: lock:check
      - task: typecheck
      - python scripts/check-python-sources.py
      - python scripts/check-experiment-identity.py
      - task: test:python
      # docs deliberately excluded — they ride their own fast lane (docs.yml)
      # registry eval through the classic door (test:python forced the flake door)
      - nix-build --no-out-link -A manifests
      # The packaged CLI includes publishing, even though fixture consumers do not.
      - nix run .#reps-runner -- publish --help
      - ./scripts/check-entrypoint-identity.sh

  check:
    desc: nix flake check + uv lock freshness
    cmds:
      - nix flake check
      - task: lock:check

  update-deps:
    desc: update the shared nixpkgs and Python build-toolchain pins in flake.lock
    cmds:
      - nix flake update
