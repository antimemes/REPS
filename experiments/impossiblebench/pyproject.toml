# The impossiblebench family's pinned env: the shared inspect wrapper + the upstream
# impossiblebench package (which brings inspect_evals[swe_bench], swebench, datasets).
# The experiment declarations are package.nix; this project only pins the software —
# a uv "virtual" project (package = false): no local code to build, the tasks come
# from upstream and the adapters select them through `pkg:impossiblebench:<task_fn>`.
# A rev bump gives each impossiblebench experiment's conditions a new version (the
# pin is part of the family subtree).
[project]
name = "reps-experiment-impossiblebench"
version = "0.1.0"
description = "ImpossibleBench (impossible SWE-bench / LiveCodeBench variants) as REPS experiments"
requires-python = ">=3.13"
dependencies = [
    "reps-inspect",
    "impossiblebench",
]

[tool.uv]
package = false

[tool.uv.sources]
reps-inspect = { path = "../../lib/reps-inspect" }
impossiblebench = { git = "https://github.com/safety-research/impossiblebench", rev = "061dc3dce6a96ab6cf02a855157263033dcfa3ba" }

[dependency-groups]
dev = ["pytest>=8"]
