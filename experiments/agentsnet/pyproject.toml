[project]
name = "agentsnet-adapter"
version = "0.1.0"  # version string does not increment, rely on git hash
description = "AgentsNet (Grötschla et al. 2025): the authors' released code, wrapped as a REPS experiment."
requires-python = ">=3.13"
# The authors pin nothing (README: `pip install datasets langchain langgraph
# langchain-openai langchain-ollama langchain-google-genai langchain-anthropic
# pandas scipy networkx numpy==1.26.4`). The venv takes each package at the last
# release before the paper and the pinned commit (2025-07-15/16), so the imports
# the code was written against (`langchain.schema`, `langchain.chat_models.
# init_chat_model`, langgraph's MessagesState/MemorySaver) resolve as they did
# then; langchain 1.0 removed `langchain.schema`. numpy 1.26.4 has no Python
# 3.13 wheel (the REPS libraries need 3.13) and floats to 2.x; the code uses
# numpy only through networkx and scipy. langchain-google-genai and
# langchain-anthropic are not installed: upstream reaches them only through
# init_chat_model, which the adapter replaces (patch.py). langchain-ollama is
# imported at module level and stays.
dependencies = [
    "reps-events",
    "reps-experiment[llm]",
    "pydantic>=2",
    "langchain==0.3.26",
    "langchain-core==0.3.68",
    "langchain-openai==0.3.28",
    "langchain-ollama==0.3.4",
    "langgraph==0.5.3",
    "datasets==4.0.0",
    "pandas==2.3.1",
    "pyarrow>=15",                 # pandas.read_parquet of the pinned dataset file
    "networkx==3.5",               # json_graph.node_link_graph(edges="links") needs >=3.4
    "scipy==1.16.0",               # utils.py imports scipy.spatial at module level
    "numpy>=2",
    "regex==2024.11.6",
]

# In-tree REPS libraries are shared with the runner.
[tool.uv.sources]
reps-testing = { path = "../../lib/reps-testing", editable = true }
reps-events = { path = "../../lib/reps-events", editable = true }
reps-experiment = { path = "../../lib/reps-experiment" }

[project.scripts]
agentsnet = "agentsnet_adapter.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentsnet_adapter"]

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist", "reps-testing"]

[tool.pytest.ini_options]
addopts = "-n auto"
