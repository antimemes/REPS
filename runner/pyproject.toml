[project]
name = "adb-runner"
version = "0.1.0"
description = "ADB experiment runner: validation, condition hashing, the runner protocol, storage, and provider credentials"
requires-python = ">=3.13"
dependencies = [
    "rfc8785>=0.1.4",
    # the event vocabulary lives in adb-events (one definition, shared with every
    # Python experiment); it also supplies the adb-emit console command.
    "adb-events",
    # the canonical provider registry (names + credential templates); the runner
    # uses it for the credential store's prompt templates and the missing-set gate
    "adb-providers",
]

# Publishing stays optional for integrations that use the runner locally.
# The shipped runner and its own tests always install this extra; keep its floors.
[project.optional-dependencies]
publish = [
    "boto3>=1.43.97",
    "pyyaml>=6",
    "zstandard>=0.25.0",
]

# adb-events is in-repo (not yet on PyPI); the nix build resolves it from the same path
[tool.uv.sources]
adb-testing = { path = "../lib/adb-testing", editable = true }
adb-events = { path = "../lib/adb-events", editable = true }
adb-providers = { path = "../lib/adb-providers" }

[project.scripts]
adb-runner = "adb_runner.cli:main"

[dependency-groups]
dev = [
    "adb-runner[publish]",
    "pytest>=8",
    "pytest-xdist",
    "adb-testing",
    "moto[s3]>=5.2.3",
    "boto3-stubs-lite>=1.43.97",
    "mypy-boto3-s3>=1.43.93",
    "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adb_runner"]

[tool.pytest.ini_options]
addopts = "-n auto"
